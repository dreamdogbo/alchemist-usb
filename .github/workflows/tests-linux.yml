name: Tests Linux

# Tests exécutés dans le cloud (aucun téléchargement lourd sur les postes des contributeurs)
on:
  push:
  pull_request:

jobs:
  scripts:
    name: Scripts et moteur sous Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck -S warning payload/linux/linux/*.sh creer-cle.sh tests/linux/*.sh tests/moteur/*.sh

      - name: Liste des composants
        run: bash payload/linux/linux/installer-poste.sh --liste

      - name: Tests du moteur (PowerShell 7 sous Linux)
        shell: pwsh
        run: ./tests/moteur/Test-Moteur.ps1

      - name: Assistant de post-installation Linux (syntaxe Python)
        run: python3 -c "import ast,sys; ast.parse(open(sys.argv[1], encoding=\"utf-8\").read())" payload/linux/linux/assistant-poste.py

      - name: Moteur PowerShell 7 sous Linux (profils, éléments)
        shell: pwsh
        run: |
          ./Build-Kit.ps1 -ListerProfils
          foreach ($u in 'Bureautique', 'Developpement') {
            $j = ./Build-Kit.ps1 -Systeme Linux -Usage $u -ListerElements | ConvertFrom-Json
            "{0} : {1} élément(s)" -f $j.Profil, $j.Items.Count
            if ($j.Items.Count -lt 1) { throw "Profil Linux $u vide" }
          }

      - name: Dernières versions stables Linux (sites officiels)
        # Dépend de sites extérieurs : signalé sans bloquer la CI
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module ./modules/Report.psm1, ./modules/Drive.psm1, ./modules/Download.psm1 -Force -DisableNameChecking
          Initialize-KitNetwork
          foreach ($d in 'Ubuntu', 'Debian', 'Mint', 'Fedora') {
            $r = Resolve-KitLinuxIso -Item @{ Distro = $d }
            "{0,-30} {1}" -f $r.Label, $r.FileName
          }

  cle-factice:
    # Clé Ventoy factice (image disque) : clés Linux, Windows et double système préparées depuis Linux,
    # garde-fous, assistants universels (création et poste) et installation réelle par l'assistant
    name: Clé factice et assistants universels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Préparation réelle d'une clé factice depuis Linux
        run: bash tests/moteur/test-cle-factice.sh

  simulation:
    name: Simulation ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:26.04', 'ubuntu:24.04', 'debian:trixie', 'fedora:latest', 'linuxmintd/mint22-amd64']
    container: ${{ matrix.image }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Prérequis d'un poste de bureau (curl, python3, sudo)
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq curl python3 sudo ca-certificates git
          else dnf install -y -q curl python3 sudo git; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stack développement (simulation, rien n'est installé)
        run: |
          useradd -m testeur
          SUDO_USER=testeur bash payload/linux/linux/installer-poste.sh -u developpement -n -y
      - name: Tous les composants (simulation)
        run: SUDO_USER=testeur bash payload/linux/linux/installer-poste.sh -t -n -y

  poste-sans-curl:
    # Ubuntu de bureau n'a pas curl par défaut : le script doit l'installer lui-même avant de
    # vérifier Internet (installation RÉELLE d'un petit composant, dans un conteneur jetable)
    name: Installation réelle sans curl (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:26.04', 'debian:trixie']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: curl absent au départ
        run: '! command -v curl'
      - name: Composant sauvegarde (Timeshift), réellement installé
        run: |
          useradd -m testeur
          SUDO_USER=testeur bash payload/linux/linux/installer-poste.sh -c sauvegarde -y
          command -v curl && command -v timeshift
