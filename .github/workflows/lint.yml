name: Analyse PowerShell

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $files = Get-ChildItem -Recurse -Include *.ps1,*.psm1,*.psd1 | Where-Object FullName -notmatch '\\(cache|logs)\\'
          $results = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings ./PSScriptAnalyzerSettings.psd1 } | Where-Object { $_.Severity -in @('Error', 'Warning') }
          $results | Format-Table -AutoSize
          if ($results) { throw "$(@($results).Count) problème(s) détecté(s)" }

      - name: Syntaxe Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e) { $bad++; $e | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($bad) { throw "$bad fichier(s) en erreur de syntaxe" }

      - name: Profils et fichiers de langue lisibles
        shell: pwsh
        run: |
          Get-ChildItem config/profils, lang, payload/windows/postinstall/lang -Filter *.psd1 | ForEach-Object { $null = Import-PowerShellDataFile $_.FullName; "OK $($_.Name)" }

  trivy:
    name: Trivy (secrets et mauvaises configurations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Trivy fs
        # Action officielle épinglée par SHA de commit (v0.36.0) : une étiquette peut être déplacée
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: v0.75.0
